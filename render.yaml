# Render Blueprint for the API (New → Blueprint → pick this repo).
services:
  - type: web
    name: todo-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # set in the Render dashboard
      - key: CORS_ORIGIN
        sync: false # e.g. https://your-site.netlify.app
